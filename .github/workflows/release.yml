name: Build and Release

on:
  push:
    tags:
      - 'v*' # 匹配 v 开头的 tag，如 v1.0.0, v1.1.0

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - name: Check version against all published stable releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' |
            node scripts/check-release-version.cjs "$GITHUB_REF_NAME"
      - run: pnpm run lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  build:
    needs: validate
    name: Build ${{ matrix.platform }}-${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS builds
          - os: macos-latest
            platform: darwin
            arch: x64
            build-command: make:mac:x64
          - os: macos-latest
            platform: darwin
            arch: arm64
            build-command: make:mac:arm64
          # Windows builds
          - os: windows-latest
            platform: win32
            arch: x64
            build-command: make:win
          # Linux builds
          - os: ubuntu-latest
            platform: linux
            arch: x64
            build-command: make:linux

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $VERSION"

      - name: Update package.json version
        shell: bash
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          # 使用 Node.js 更新 package.json 版本号
          node -e "const fs = require('fs'); const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8')); pkg.version = '$VERSION'; fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');"
          echo "✅ 已更新 package.json 版本号为: $VERSION"
          grep '"version"' package.json

      - name: Build application
        run: pnpm run ${{ matrix.build-command }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify macOS bundle signature
        if: matrix.platform == 'darwin'
        run: codesign --verify --deep --strict "out/ChatHub Desktop-darwin-${{ matrix.arch }}/ChatHub Desktop.app"

      - name: Check packaged macOS startup
        if: matrix.platform == 'darwin' && runner.arch == matrix.arch
        run: node scripts/check-packaged-startup.cjs "out/ChatHub Desktop-darwin-${{ matrix.arch }}/ChatHub Desktop.app/Contents/MacOS/chathub-desktop"

      - name: Upload macOS artifacts
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/zip/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Verify Windows installer, portable ZIP and update feed
        if: matrix.platform == 'win32'
        run: node scripts/check-windows-artifacts.cjs

      - name: Check packaged Windows startup
        if: matrix.platform == 'win32'
        run: node scripts/check-packaged-startup.cjs "out/ChatHub Desktop-windows-x64/chathub-desktop.exe"

      - name: Upload Windows artifacts
        if: matrix.platform == 'win32'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            out/make/squirrel.windows/**/*.exe
            out/make/squirrel.windows/**/*.nupkg
            out/make/squirrel.windows/**/RELEASES
            out/make/zip/*.zip
          retention-days: 30
          if-no-files-found: error

      - name: Upload Linux artifacts
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}
          path: out/make/deb/**/*.deb
          retention-days: 30
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: get_version
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Tag version: $VERSION"

      - name: Read tagged commit time
        id: commit_time
        run: git log -1 --format='timestamp=%cI' >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: |
          echo "📦 构建产物列表："
          find artifacts \( -name "*.zip" -o -name "*.deb" -o -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \) -type f || true
          echo ""
          echo "文件详情："
          find artifacts \( -name "*.zip" -o -name "*.deb" -o -name "*.exe" -o -name "*.nupkg" -o -name "RELEASES" \) -type f -exec ls -lh {} \;

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: |
            ## Desktop ChatGPT ${{ steps.get_version.outputs.version }}

            ### 📥 下载

            - **macOS (Intel)**: ChatHub.Desktop-darwin-x64-${{ steps.get_version.outputs.version }}.zip
            - **macOS (Apple Silicon)**: ChatHub.Desktop-darwin-arm64-${{ steps.get_version.outputs.version }}.zip
            - **Windows (x64)**: 匹配架构的 `Setup.exe` 安装包
            - **Windows 便携版 (x64)**: ChatHub.Desktop-windows-x64-${{ steps.get_version.outputs.version }}.zip
            - **Linux (x64)**: chathub-desktop_${{ steps.get_version.outputs.version }}_amd64.deb
            
            ### 📋 安装说明

            #### macOS
            1. 下载对应架构的 ZIP 文件
            2. 解压并将 `ChatHub Desktop.app` 拖入「应用程序」文件夹
            3. 首次打开可能需要右键点击 → 打开（绕过安全检查）

            #### Windows
            1. 优先下载 `Setup.exe` 安装包完成安装
            2. 已安装版本后，后续更新将由应用内自动下载并提示重启安装
            3. 如需免安装版本，可下载 ZIP 文件并手动运行 `chathub-desktop.exe`

            #### Linux (Ubuntu/Debian)
            1. 下载 `.deb` 安装包
            2. 双击安装或在终端运行 `sudo dpkg -i chathub-desktop_${{ steps.get_version.outputs.version }}_amd64.deb`
            3. 如果有依赖问题，请运行 `sudo apt-get install -f`

            ---

            **构建信息：**
            - 提交时间: ${{ steps.commit_time.outputs.timestamp }}
            - 提交: ${{ github.sha }}
          files: |
            artifacts/**/*.zip
            artifacts/**/*.deb
            artifacts/**/*.exe
            artifacts/**/*.nupkg
            artifacts/**/RELEASES
          draft: false
          prerelease: ${{ contains(github.ref, '-') || contains(github.ref, 'alpha') || contains(github.ref, 'beta') || contains(github.ref, 'rc') }}
          generate_release_notes: true

      - name: Sync version and merge to main
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          TARGET_BRANCH=${{ github.event.repository.default_branch }}
          
          # 获取触发 tag 的源分支
          SOURCE_BRANCH=$(git branch -r --contains ${{ github.sha }} | grep -v HEAD | head -1 | sed 's/origin\///' | xargs)
          echo "源分支: $SOURCE_BRANCH"
          echo "目标分支: $TARGET_BRANCH"
          echo "版本号: $VERSION"

          # 配置 git 机器人
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # 获取最新代码
          git fetch origin --prune

          # 切换到目标分支
          git checkout $TARGET_BRANCH
          git pull origin $TARGET_BRANCH --rebase

          # 合并源分支到目标分支（如果源分支不是目标分支本身）
          if [ "$SOURCE_BRANCH" != "$TARGET_BRANCH" ] && [ -n "$SOURCE_BRANCH" ]; then
            echo "🔀 合并 $SOURCE_BRANCH 到 $TARGET_BRANCH..."
            git merge origin/$SOURCE_BRANCH --no-edit -m "chore: merge $SOURCE_BRANCH after release $VERSION [skip ci]" || {
              echo "⚠️ 合并存在冲突，尝试使用 theirs 策略..."
              git merge origin/$SOURCE_BRANCH --no-edit -X theirs -m "chore: merge $SOURCE_BRANCH after release $VERSION [skip ci]"
            }
          fi

          # 更新版本号 (不产生新 tag)
          npm version $VERSION --no-git-tag-version || true

          # 检查是否有变化需要提交
          if git diff --quiet package.json; then
            echo "✅ 版本号已同步，无需额外提交"
          else
            git add package.json
            git add package-lock.json pnpm-lock.yaml 2>/dev/null || true
            git commit -m "chore: bump version to $VERSION [skip ci]"
          fi

          # 推送更改
          git push origin $TARGET_BRANCH
          echo "✅ 已成功合并并推送到 $TARGET_BRANCH"
